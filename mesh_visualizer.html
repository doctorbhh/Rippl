<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rippl Mesh Visualizer</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Inter', sans-serif;
    background: #0D1B2A;
    color: #E0E1DD;
    height: 100vh;
    overflow: hidden;
  }

  /* ── Header bar ─────────────────────────────── */
  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 20px;
    background: #1B263B;
    border-bottom: 1px solid #243447;
  }
  .header h1 {
    font-size: 18px;
    font-weight: 700;
    background: linear-gradient(135deg, #FF6B35, #FF8C42);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    letter-spacing: 1px;
  }
  .header-controls { display: flex; gap: 10px; align-items: center; }

  .btn {
    padding: 8px 16px;
    border: none;
    border-radius: 8px;
    font-family: inherit;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
  }
  .btn-primary {
    background: linear-gradient(135deg, #FF6B35, #FF8C42);
    color: #0D1B2A;
  }
  .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 4px 12px rgba(255,107,53,0.4); }
  .btn-secondary {
    background: #243447;
    color: #9BA4B5;
    border: 1px solid #374a5e;
  }
  .btn-secondary:hover { background: #2c3e50; color: #E0E1DD; }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

  .status-dot {
    width: 10px; height: 10px;
    border-radius: 50%;
    background: #EF4444;
    transition: background 0.3s;
  }
  .status-dot.connected { background: #4ADE80; box-shadow: 0 0 8px rgba(74,222,128,0.5); }

  /* ── Main layout ────────────────────────────── */
  .main {
    display: flex;
    height: calc(100vh - 56px);
  }

  /* ── Canvas area ────────────────────────────── */
  .canvas-area {
    flex: 1;
    position: relative;
    background: radial-gradient(circle at center, #142034 0%, #0D1B2A 100%);
  }
  #meshCanvas { width: 100%; height: 100%; }

  .canvas-overlay {
    position: absolute;
    top: 16px;
    left: 16px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .stat-chip {
    background: rgba(27, 38, 59, 0.85);
    backdrop-filter: blur(8px);
    border: 1px solid #374a5e;
    border-radius: 10px;
    padding: 8px 14px;
    font-size: 12px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .stat-chip .value {
    font-weight: 700;
    font-size: 16px;
    color: #FF8C42;
  }

  /* ── Legend ──────────────────────────────────── */
  .legend {
    position: absolute;
    bottom: 16px;
    left: 16px;
    background: rgba(27, 38, 59, 0.85);
    backdrop-filter: blur(8px);
    border: 1px solid #374a5e;
    border-radius: 12px;
    padding: 12px 16px;
    font-size: 11px;
    display: flex;
    gap: 16px;
  }
  .legend-item { display: flex; align-items: center; gap: 6px; }
  .legend-dot {
    width: 10px; height: 10px;
    border-radius: 50%;
  }
  .legend-line {
    width: 20px; height: 2px;
  }

  /* ── Side panel ─────────────────────────────── */
  .side-panel {
    width: 340px;
    background: #1B263B;
    border-left: 1px solid #243447;
    display: flex;
    flex-direction: column;
  }
  .panel-tabs {
    display: flex;
    border-bottom: 1px solid #243447;
  }
  .panel-tab {
    flex: 1;
    padding: 10px;
    text-align: center;
    font-size: 12px;
    font-weight: 600;
    color: #6B7280;
    cursor: pointer;
    border-bottom: 2px solid transparent;
    transition: all 0.2s;
  }
  .panel-tab.active { color: #FF8C42; border-bottom-color: #FF8C42; }
  .panel-tab:hover { color: #9BA4B5; }

  .panel-content {
    flex: 1;
    overflow-y: auto;
    padding: 12px;
  }

  .event-item {
    padding: 8px 10px;
    margin-bottom: 4px;
    border-radius: 8px;
    font-size: 12px;
    font-family: 'Courier New', monospace;
    background: rgba(36, 52, 71, 0.5);
    border-left: 3px solid #374a5e;
    animation: slideIn 0.2s ease-out;
  }
  @keyframes slideIn {
    from { opacity: 0; transform: translateX(20px); }
    to   { opacity: 1; transform: translateX(0); }
  }
  .event-item.node_add  { border-left-color: #4ADE80; }
  .event-item.node_rm   { border-left-color: #EF4444; }
  .event-item.msg_tx    { border-left-color: #FF8C42; }
  .event-item.msg_rx    { border-left-color: #60A5FA; }
  .event-item.msg_relay { border-left-color: #A78BFA; }
  .event-item.ack_rx    { border-left-color: #34D399; }
  .event-item.topo      { border-left-color: #FBBF24; }

  .event-time { color: #6B7280; margin-right: 8px; }
  .event-type { font-weight: 700; }
  .event-type.node_add  { color: #4ADE80; }
  .event-type.node_rm   { color: #EF4444; }
  .event-type.msg_tx    { color: #FF8C42; }
  .event-type.msg_rx    { color: #60A5FA; }
  .event-type.msg_relay { color: #A78BFA; }
  .event-type.ack_rx    { color: #34D399; }
  .event-type.topo      { color: #FBBF24; }

  .node-list-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 12px;
    margin-bottom: 6px;
    background: rgba(36, 52, 71, 0.5);
    border-radius: 10px;
    border: 1px solid #374a5e;
  }
  .node-id { font-weight: 700; font-size: 14px; color: #FF8C42; }
  .node-meta { font-size: 11px; color: #6B7280; }
  .node-health {
    width: 8px; height: 8px;
    border-radius: 50%;
  }

  /* ── Scrollbar ──────────────────────────────── */
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: #374a5e; border-radius: 3px; }
</style>
</head>
<body>

<div class="header">
  <h1>⚡ RIPPL MESH VISUALIZER</h1>
  <div class="header-controls">
    <div class="status-dot" id="statusDot"></div>
    <button class="btn btn-primary" id="btnConnect" onclick="toggleConnection()">🔌 Connect</button>
    <button class="btn btn-secondary" id="btnPause" onclick="togglePause()" disabled>⏸ Pause</button>
    <button class="btn btn-secondary" onclick="clearAll()">🗑 Clear</button>
  </div>
</div>

<div class="main">
  <div class="canvas-area">
    <canvas id="meshCanvas"></canvas>

    <div class="canvas-overlay">
      <div class="stat-chip">Nodes <span class="value" id="statNodes">0</span></div>
      <div class="stat-chip">Messages <span class="value" id="statMsgs">0</span></div>
      <div class="stat-chip">ACK Rate <span class="value" id="statAck">—</span></div>
    </div>

    <div class="legend">
      <div class="legend-item">
        <div class="legend-dot" style="background:#FF8C42"></div> This Node
      </div>
      <div class="legend-item">
        <div class="legend-dot" style="background:#4ADE80"></div> Direct (1-hop)
      </div>
      <div class="legend-item">
        <div class="legend-dot" style="background:#60A5FA"></div> 2-hop
      </div>
      <div class="legend-item">
        <div class="legend-line" style="background:#4ADE80"></div> Link
      </div>
      <div class="legend-item">
        <div class="legend-line" style="background:#FF8C42; border-top: 2px dashed #FF8C42; height:0"></div> Msg Hop
      </div>
      <div class="legend-item">
        <div class="legend-line" style="background:#34D399; border-top: 2px dashed #34D399; height:0"></div> ACK
      </div>
    </div>
  </div>

  <div class="side-panel">
    <div class="panel-tabs">
      <div class="panel-tab active" onclick="switchTab('events')">Events</div>
      <div class="panel-tab" onclick="switchTab('nodes')">Nodes</div>
    </div>
    <div class="panel-content" id="panelContent"></div>
  </div>
</div>

<script>
// ══════════════════════════════════════════════
// STATE
// ══════════════════════════════════════════════
let port = null, reader = null, connected = false, paused = false;
let lineBuffer = '';
let activeTab = 'events';
const events = [];
const MAX_EVENTS = 200;

// Graph state
const nodes = new Map();   // id -> { id, x, y, vx, vy, hop, rssi, health, addedAt }
const edges = new Map();   // "A-B" -> { from, to, strength }
const pulses = [];         // { from, to, progress, color, speed }
let myNodeId = null;
let msgCount = 0, ackCount = 0;

// Physics
const REPULSION = 800;
const SPRING_K = 0.04;
const SPRING_LEN = 140;
const DAMPING = 0.85;
const CENTER_PULL = 0.005;

// ══════════════════════════════════════════════
// WEB SERIAL
// ══════════════════════════════════════════════
async function toggleConnection() {
  if (connected) {
    await disconnect();
  } else {
    await connect();
  }
}

async function connect() {
  try {
    port = await navigator.serial.requestPort();
    await port.open({ baudRate: 115200 });
    connected = true;
    document.getElementById('statusDot').classList.add('connected');
    document.getElementById('btnConnect').textContent = '⏏ Disconnect';
    document.getElementById('btnPause').disabled = false;
    readLoop();
  } catch (e) {
    console.error('Connection failed:', e);
  }
}

async function disconnect() {
  connected = false;
  document.getElementById('statusDot').classList.remove('connected');
  document.getElementById('btnConnect').textContent = '🔌 Connect';
  document.getElementById('btnPause').disabled = true;
  try {
    if (reader) { await reader.cancel(); reader = null; }
    if (port)   { await port.close(); port = null; }
  } catch (e) {}
}

async function readLoop() {
  const decoder = new TextDecoderStream();
  const inputStream = port.readable.pipeTo(decoder.writable);
  reader = decoder.readable.getReader();

  try {
    while (connected) {
      const { value, done } = await reader.read();
      if (done) break;
      if (value && !paused) processChunk(value);
    }
  } catch (e) {
    if (connected) console.error('Read error:', e);
  }
}

function processChunk(chunk) {
  lineBuffer += chunk;
  const lines = lineBuffer.split('\n');
  lineBuffer = lines.pop(); // keep incomplete line

  for (const line of lines) {
    const trimmed = line.trim();
    if (trimmed.startsWith('@EVT:')) {
      try {
        const json = JSON.parse(trimmed.substring(5));
        handleEvent(json);
      } catch (e) {}
    }
  }
}

// ══════════════════════════════════════════════
// EVENT HANDLERS
// ══════════════════════════════════════════════
function handleEvent(evt) {
  const now = Date.now();

  switch (evt.e) {
    case 'topo':
      myNodeId = evt.me;
      ensureNode(myNodeId, 0, 0);
      nodes.get(myNodeId).isMe = true;

      // Mark all existing as potentially stale
      for (const [id, n] of nodes) if (id !== myNodeId) n._seen = false;

      for (const n of evt.nodes) {
        ensureNode(n.id, n.hop, n.rssi);
        nodes.get(n.id)._seen = true;
        const edgeKey = makeEdgeKey(myNodeId, n.id);
        edges.set(edgeKey, { from: myNodeId, to: n.id, hop: n.hop });
      }
      break;

    case 'node_add':
      ensureNode(evt.id, evt.hop, evt.rssi);
      nodes.get(evt.id).health = 1;
      nodes.get(evt.id).addedAt = now;
      if (myNodeId) {
        edges.set(makeEdgeKey(myNodeId, evt.id),
          { from: myNodeId, to: evt.id, hop: evt.hop });
      }
      break;

    case 'node_rm':
      if (nodes.has(evt.id)) {
        nodes.get(evt.id).health = 0;
        nodes.get(evt.id).removedAt = now;
        // Remove after fade-out
        setTimeout(() => {
          nodes.delete(evt.id);
          // Remove any edges involving this node
          for (const [k] of edges) {
            if (k.includes(evt.id)) edges.delete(k);
          }
        }, 2000);
      }
      break;

    case 'msg_tx':
      msgCount++;
      // Pulse from me to all neighbors
      if (myNodeId) {
        for (const [id, n] of nodes) {
          if (id !== myNodeId && n.hop === 1) {
            pulses.push({ from: myNodeId, to: id, progress: 0, color: '#FF8C42', speed: 0.025 });
          }
        }
      }
      break;

    case 'msg_rx':
      msgCount++;
      // Pulse arriving at me
      if (myNodeId && nodes.has(evt.from)) {
        pulses.push({ from: evt.from, to: myNodeId, progress: 0, color: '#60A5FA', speed: 0.03 });
      }
      break;

    case 'msg_relay':
      if (myNodeId && nodes.has(evt.to)) {
        pulses.push({ from: myNodeId, to: evt.to, progress: 0, color: '#A78BFA', speed: 0.025 });
      }
      break;

    case 'ack_rx':
      ackCount++;
      if (nodes.has(evt.from)) {
        pulses.push({ from: evt.from, to: myNodeId || evt.from, progress: 0, color: '#34D399', speed: 0.03 });
      }
      break;
  }

  // Log event
  events.unshift({ time: now, type: evt.e, data: evt });
  if (events.length > MAX_EVENTS) events.pop();

  updateStats();
  if (activeTab === 'events') renderEventPanel();
  if (activeTab === 'nodes')  renderNodePanel();
}

function ensureNode(id, hop, rssi) {
  if (!nodes.has(id)) {
    const angle = Math.random() * Math.PI * 2;
    const dist = 80 + Math.random() * 60;
    nodes.set(id, {
      id, hop, rssi, health: 1,
      x: canvas.width / 2 + Math.cos(angle) * dist,
      y: canvas.height / 2 + Math.sin(angle) * dist,
      vx: 0, vy: 0,
      isMe: false, addedAt: Date.now(), removedAt: null
    });
  } else {
    const n = nodes.get(id);
    n.hop = hop;
    n.rssi = rssi;
    n.health = 1;
    n.removedAt = null;
  }
}

function makeEdgeKey(a, b) {
  return a < b ? `${a}-${b}` : `${b}-${a}`;
}

function updateStats() {
  let aliveCount = 0;
  for (const [, n] of nodes) if (n.health > 0) aliveCount++;
  document.getElementById('statNodes').textContent = aliveCount;
  document.getElementById('statMsgs').textContent = msgCount;
  document.getElementById('statAck').textContent =
    msgCount > 0 ? Math.round((ackCount / msgCount) * 100) + '%' : '—';
}

// ══════════════════════════════════════════════
// CANVAS RENDERING — Force-Directed Graph
// ══════════════════════════════════════════════
const canvas = document.getElementById('meshCanvas');
const ctx = canvas.getContext('2d');

function resize() {
  const area = canvas.parentElement;
  canvas.width = area.clientWidth * devicePixelRatio;
  canvas.height = area.clientHeight * devicePixelRatio;
  canvas.style.width = area.clientWidth + 'px';
  canvas.style.height = area.clientHeight + 'px';
  ctx.scale(devicePixelRatio, devicePixelRatio);
}
window.addEventListener('resize', resize);
resize();

function physicsStep() {
  const nodeArr = [...nodes.values()].filter(n => n.health > 0 || n.removedAt);
  const W = canvas.width / devicePixelRatio;
  const H = canvas.height / devicePixelRatio;
  const cx = W / 2, cy = H / 2;

  // Repulsion between all node pairs
  for (let i = 0; i < nodeArr.length; i++) {
    for (let j = i + 1; j < nodeArr.length; j++) {
      const a = nodeArr[i], b = nodeArr[j];
      let dx = b.x - a.x, dy = b.y - a.y;
      let dist = Math.sqrt(dx * dx + dy * dy) || 1;
      let force = REPULSION / (dist * dist);
      let fx = (dx / dist) * force, fy = (dy / dist) * force;
      a.vx -= fx; a.vy -= fy;
      b.vx += fx; b.vy += fy;
    }
  }

  // Spring attraction along edges
  for (const [, edge] of edges) {
    const a = nodes.get(edge.from), b = nodes.get(edge.to);
    if (!a || !b) continue;
    let dx = b.x - a.x, dy = b.y - a.y;
    let dist = Math.sqrt(dx * dx + dy * dy) || 1;
    let force = SPRING_K * (dist - SPRING_LEN);
    let fx = (dx / dist) * force, fy = (dy / dist) * force;
    a.vx += fx; a.vy += fy;
    b.vx -= fx; b.vy -= fy;
  }

  // Center pull + damping + update
  for (const n of nodeArr) {
    n.vx += (cx - n.x) * CENTER_PULL;
    n.vy += (cy - n.y) * CENTER_PULL;
    n.vx *= DAMPING;
    n.vy *= DAMPING;
    n.x += n.vx;
    n.y += n.vy;
    // Clamp
    n.x = Math.max(40, Math.min(W - 40, n.x));
    n.y = Math.max(40, Math.min(H - 40, n.y));
  }
}

function draw() {
  const W = canvas.width / devicePixelRatio;
  const H = canvas.height / devicePixelRatio;
  ctx.clearRect(0, 0, W, H);

  // Draw grid dots
  ctx.fillStyle = 'rgba(55, 74, 94, 0.3)';
  for (let x = 0; x < W; x += 40)
    for (let y = 0; y < H; y += 40)
      ctx.fillRect(x, y, 1, 1);

  // Draw edges
  for (const [, edge] of edges) {
    const a = nodes.get(edge.from), b = nodes.get(edge.to);
    if (!a || !b) continue;
    ctx.beginPath();
    ctx.moveTo(a.x, a.y);
    ctx.lineTo(b.x, b.y);
    if (edge.hop === 1) {
      ctx.strokeStyle = 'rgba(74, 222, 128, 0.3)';
      ctx.lineWidth = 2;
      ctx.setLineDash([]);
    } else {
      ctx.strokeStyle = 'rgba(96, 165, 250, 0.2)';
      ctx.lineWidth = 1;
      ctx.setLineDash([6, 4]);
    }
    ctx.stroke();
    ctx.setLineDash([]);
  }

  // Draw pulses (animated dots on edges)
  for (let i = pulses.length - 1; i >= 0; i--) {
    const p = pulses[i];
    p.progress += p.speed;
    if (p.progress >= 1) { pulses.splice(i, 1); continue; }

    const a = nodes.get(p.from), b = nodes.get(p.to);
    if (!a || !b) { pulses.splice(i, 1); continue; }

    const x = a.x + (b.x - a.x) * p.progress;
    const y = a.y + (b.y - a.y) * p.progress;

    // Trail
    ctx.beginPath();
    ctx.moveTo(a.x + (b.x - a.x) * Math.max(0, p.progress - 0.15), 
               a.y + (b.y - a.y) * Math.max(0, p.progress - 0.15));
    ctx.lineTo(x, y);
    ctx.strokeStyle = p.color + '60';
    ctx.lineWidth = 3;
    ctx.stroke();

    // Dot
    ctx.beginPath();
    ctx.arc(x, y, 5, 0, Math.PI * 2);
    ctx.fillStyle = p.color;
    ctx.fill();

    // Glow
    ctx.beginPath();
    ctx.arc(x, y, 12, 0, Math.PI * 2);
    const glow = ctx.createRadialGradient(x, y, 2, x, y, 12);
    glow.addColorStop(0, p.color + '60');
    glow.addColorStop(1, p.color + '00');
    ctx.fillStyle = glow;
    ctx.fill();
  }

  // Draw nodes
  const now = Date.now();
  for (const [id, n] of nodes) {
    let alpha = 1;
    let radius = 22;

    // Fade-in on add
    if (now - n.addedAt < 1000) {
      alpha = (now - n.addedAt) / 1000;
      radius = 22 + 8 * (1 - alpha); // pulse effect
    }
    // Fade-out on remove
    if (n.removedAt) {
      alpha = Math.max(0, 1 - (now - n.removedAt) / 2000);
    }

    if (alpha <= 0) continue;

    // Glow ring
    ctx.beginPath();
    ctx.arc(n.x, n.y, radius + 6, 0, Math.PI * 2);
    let glowColor = n.isMe ? '#FF6B35' : (n.hop === 1 ? '#4ADE80' : '#60A5FA');
    if (n.removedAt) glowColor = '#EF4444';
    const ringGlow = ctx.createRadialGradient(n.x, n.y, radius, n.x, n.y, radius + 6);
    ringGlow.addColorStop(0, glowColor + Math.round(alpha * 40).toString(16).padStart(2, '0'));
    ringGlow.addColorStop(1, glowColor + '00');
    ctx.fillStyle = ringGlow;
    ctx.fill();

    // Node circle
    ctx.beginPath();
    ctx.arc(n.x, n.y, radius, 0, Math.PI * 2);
    const grad = ctx.createRadialGradient(n.x - 4, n.y - 4, 2, n.x, n.y, radius);
    if (n.isMe) {
      grad.addColorStop(0, '#FF8C42');
      grad.addColorStop(1, '#FF6B35');
    } else if (n.removedAt) {
      grad.addColorStop(0, '#EF4444');
      grad.addColorStop(1, '#991B1B');
    } else if (n.hop === 1) {
      grad.addColorStop(0, '#4ADE80');
      grad.addColorStop(1, '#166534');
    } else {
      grad.addColorStop(0, '#60A5FA');
      grad.addColorStop(1, '#1E40AF');
    }
    ctx.globalAlpha = alpha;
    ctx.fillStyle = grad;
    ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.15)';
    ctx.lineWidth = 1;
    ctx.stroke();

    // Node label
    ctx.fillStyle = '#fff';
    ctx.font = '600 11px Inter, sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(id, n.x, n.y);

    // Hop count badge
    if (!n.isMe) {
      const badge = n.hop === 1 ? '1h' : '2h';
      ctx.font = '500 9px Inter, sans-serif';
      ctx.fillStyle = 'rgba(224,225,221,0.6)';
      ctx.fillText(badge, n.x, n.y + radius + 12);
    } else {
      ctx.font = '500 9px Inter, sans-serif';
      ctx.fillStyle = 'rgba(255,140,66,0.8)';
      ctx.fillText('YOU', n.x, n.y + radius + 12);
    }

    // RSSI indicator
    if (n.rssi && !n.isMe) {
      ctx.font = '400 8px Inter, sans-serif';
      ctx.fillStyle = 'rgba(155,164,181,0.5)';
      ctx.fillText(`${n.rssi}dB`, n.x, n.y - radius - 8);
    }

    ctx.globalAlpha = 1;
  }

  // Center label when empty
  if (nodes.size === 0) {
    ctx.fillStyle = '#6B7280';
    ctx.font = '500 16px Inter, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('Connect an ESP32 to see the mesh network', W / 2, H / 2);
    ctx.font = '400 13px Inter, sans-serif';
    ctx.fillText('Click "Connect" and select the serial port', W / 2, H / 2 + 28);
  }
}

function animationLoop() {
  if (!paused) {
    physicsStep();
    draw();
  }
  requestAnimationFrame(animationLoop);
}
animationLoop();

// ══════════════════════════════════════════════
// SIDE PANEL
// ══════════════════════════════════════════════
function switchTab(tab) {
  activeTab = tab;
  document.querySelectorAll('.panel-tab').forEach(t => t.classList.remove('active'));
  document.querySelector(`.panel-tab:nth-child(${tab === 'events' ? 1 : 2})`).classList.add('active');
  if (tab === 'events') renderEventPanel();
  else renderNodePanel();
}

function renderEventPanel() {
  const el = document.getElementById('panelContent');
  el.innerHTML = events.slice(0, 50).map(e => {
    const time = new Date(e.time).toLocaleTimeString('en', { hour12: false });
    const desc = formatEvent(e);
    return `<div class="event-item ${e.type}">
      <span class="event-time">${time}</span>
      <span class="event-type ${e.type}">${e.type}</span> ${desc}
    </div>`;
  }).join('');
}

function formatEvent(e) {
  const d = e.data;
  switch (e.type) {
    case 'node_add':  return `<b>${d.id}</b> joined (hop:${d.hop} rssi:${d.rssi})`;
    case 'node_rm':   return `<b>${d.id}</b> timed out`;
    case 'msg_tx':    return `#${d.mid} sent → ${d.to}`;
    case 'msg_rx':    return `#${d.mid} from <b>${d.from}</b> (${d.hop} hops)`;
    case 'msg_relay': return `#${d.mid} relayed → <b>${d.to}</b>`;
    case 'ack_rx':    return `#${d.mid} ACK from <b>${d.from}</b> ✓`;
    case 'topo':      return `${d.nodes.length} nodes in table`;
    default:          return JSON.stringify(d);
  }
}

function renderNodePanel() {
  const el = document.getElementById('panelContent');
  const sorted = [...nodes.values()]
    .filter(n => n.health > 0)
    .sort((a, b) => a.hop - b.hop);

  el.innerHTML = sorted.map(n => {
    const color = n.isMe ? '#FF8C42' : (n.hop === 1 ? '#4ADE80' : '#60A5FA');
    const label = n.isMe ? 'This Node' : `${n.hop}-hop • ${n.rssi || '?'}dB`;
    return `<div class="node-list-item">
      <div>
        <div class="node-id">${n.id}</div>
        <div class="node-meta">${label}</div>
      </div>
      <div class="node-health" style="background:${color};box-shadow:0 0 6px ${color}"></div>
    </div>`;
  }).join('') || '<div style="text-align:center;color:#6B7280;padding:40px">No nodes discovered yet</div>';
}

// ══════════════════════════════════════════════
// CONTROLS
// ══════════════════════════════════════════════
function togglePause() {
  paused = !paused;
  document.getElementById('btnPause').textContent = paused ? '▶ Resume' : '⏸ Pause';
}

function clearAll() {
  nodes.clear();
  edges.clear();
  pulses.length = 0;
  events.length = 0;
  myNodeId = null;
  msgCount = 0;
  ackCount = 0;
  updateStats();
  renderEventPanel();
}

// Initial panel
renderEventPanel();
</script>
</body>
</html>
